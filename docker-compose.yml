services:
  bot:
    build: .
    container_name: pricepilot_bot
    command: python run.py
    env_file: .env
    restart: unless-stopped
    volumes:
      - pricepilot_data:/app/data

  api:
    build: .
    container_name: pricepilot_api
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - pricepilot_data:/app/data

volumes:
  pricepilot_data:
